name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_scaffold.py
      - run: python tools/check_deploy.py
      - name: Build standalone simulator wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/kart-wheels ./simulation
      - name: Verify standalone import outside the checkout
        run: |
          python -m venv /tmp/kart-import
          /tmp/kart-import/bin/python -m pip install /tmp/kart-wheels/*.whl
          cd /tmp
          /tmp/kart-import/bin/python -c "import sim, mujoco; print(mujoco.__version__)"

      - name: Test MuJoCo runtime and command validity
        run: |
          PYTHONPATH=simulation/src /tmp/kart-import/bin/python -m unittest discover -s simulation/tests -v
          PYTHONPATH=simulation/src:src/simulation/sim_ros /tmp/kart-import/bin/python -m unittest discover -s src/simulation/sim_ros/tests -v
      - name: Smoke-test installed simulator assets outside checkout
        run: |
          cd /tmp
          /tmp/kart-import/bin/python -m sim --model demo --duration 0.1
